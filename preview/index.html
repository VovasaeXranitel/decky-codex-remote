<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Remote Decky Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Motiva Sans, Inter, ui-sans-serif, system-ui, sans-serif;
        background: #090b10;
        color: #d7d7d9;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .screen {
        background:
          linear-gradient(120deg, rgba(20, 26, 36, 0.92), rgba(14, 16, 21, 0.94)),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 34px);
        height: 100vh;
        overflow: hidden;
        position: relative;
        width: 100vw;
      }

      .game {
        border: 1px solid rgba(255, 255, 255, 0.08);
        height: 42%;
        left: 7%;
        opacity: 0.55;
        position: absolute;
        top: 20%;
        transform: skewX(-7deg);
        width: 42%;
      }

      .shade {
        background: rgba(0, 0, 0, 0.36);
        height: 100%;
        position: absolute;
        width: 100%;
      }

      .quick-access {
        background: #10131a;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: -22px 0 60px rgba(0, 0, 0, 0.5);
        color: #d7d7d9;
        height: 100%;
        padding: 18px 16px;
        position: absolute;
        right: 0;
        top: 0;
        width: 360px;
      }

      .title {
        color: #f1f1f2;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .endpoint,
      .muted {
        color: #8f9298;
        font-size: 11px;
      }

      .endpoint {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row {
        margin-top: 10px;
      }

      .grid {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr 1fr;
      }

      .single {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr;
      }

      button {
        align-items: center;
        background: #171b22;
        border: 1px solid #323844;
        border-radius: 4px;
        color: #d5d8de;
        display: flex;
        font-size: 12px;
        font-weight: 500;
        justify-content: center;
        line-height: 1.15;
        min-height: 31px;
        padding: 5px 8px;
        width: 100%;
      }

      button:focus-visible {
        background: #242b36;
        border-color: #8c98aa;
        box-shadow: inset 0 0 0 1px #8c98aa;
        color: #f3f4f7;
        outline: 0;
      }

      input {
        background: #171b22;
        border: 1px solid #323844;
        border-radius: 4px;
        color: #d5d8de;
        min-height: 33px;
        outline: 0;
        padding: 6px 8px;
        width: 100%;
      }

      label {
        color: #a5a8af;
        display: block;
        font-size: 11px;
        font-weight: 600;
        margin: 8px 0 4px;
        text-transform: uppercase;
      }

      .settings {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        margin: 10px 0 8px;
        padding-bottom: 8px;
      }

      .status {
        align-items: center;
        display: flex;
        gap: 8px;
        margin-top: 12px;
        min-height: 24px;
      }

      .dot {
        background: #5fb878;
        border-radius: 50%;
        height: 7px;
        width: 7px;
      }

      .task,
      .message {
        color: #d7d7d9;
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="game"></div>
      <div class="shade"></div>
      <aside class="quick-access" aria-label="Codex Remote panel">
        <div class="title">Codex</div>
        <div class="endpoint">ws://192.168.1.81:43871</div>

        <div class="row grid">
          <button>Hide Settings</button>
          <button>Refresh</button>
        </div>

        <section class="settings">
          <label for="host">Host</label>
          <input id="host" value="192.168.1.81" />
          <div class="row single"><button>Scan LAN</button></div>
          <label for="port">Port</label>
          <input id="port" value="43871" />
          <label for="token">Token</label>
          <input id="token" value="••••••••••••••••" />
          <div class="row grid">
            <button>Connect</button>
            <button>Disconnect</button>
          </div>
          <div class="row single"><button>Check Server</button></div>
          <div class="row message">Found 1 Codex server(s).</div>
        </section>

        <section>
          <div class="status">
            <span class="dot"></span>
            <span>Decky remote</span>
            <span class="muted">working</span>
          </div>
          <div class="row task">
            <div class="muted">Current task</div>
            <div>Fix LAN discovery and clean the Steam Deck panel UI.</div>
          </div>
          <div class="row messages">
            <div class="message">Codex App Server is reachable.</div>
            <div class="message">LAN scan returned 192.168.1.81:43871.</div>
            <div class="message">Ready for remote actions.</div>
          </div>
          <label for="message">Message</label>
          <input id="message" value="" />
          <div class="row single"><button>Send</button></div>
        </section>
      </aside>
    </main>
  </body>
</html>
