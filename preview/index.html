<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Remote Decky Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #080808;
        color: #d8d8d8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .deck {
        align-items: center;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.62)),
          #111;
        display: flex;
        height: 100vh;
        justify-content: center;
        padding: 18px;
      }

      .screen {
        aspect-ratio: 16 / 9;
        background: #0b0b0b;
        border: 1px solid #242424;
        border-radius: 12px;
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.46);
        max-height: calc(100vh - 36px);
        max-width: calc(100vw - 36px);
        overflow: hidden;
        position: relative;
        width: min(1280px, calc(100vw - 36px));
      }

      .game {
        background:
          linear-gradient(130deg, rgba(17, 20, 24, 0.96), rgba(21, 24, 23, 0.92)),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.025) 0,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px,
            transparent 34px
          );
        height: 100%;
        position: absolute;
        width: 100%;
      }

      .game::before {
        background:
          linear-gradient(180deg, rgba(216, 216, 216, 0.08), transparent),
          #141414;
        border: 1px solid rgba(255, 255, 255, 0.08);
        content: "";
        height: 44%;
        left: 9%;
        position: absolute;
        top: 18%;
        transform: skewX(-8deg);
        width: 42%;
      }

      .game::after {
        border-bottom: 2px solid rgba(255, 255, 255, 0.09);
        border-top: 2px solid rgba(255, 255, 255, 0.08);
        content: "";
        height: 18%;
        left: 11%;
        position: absolute;
        top: 70%;
        width: 48%;
      }

      .veil {
        background: rgba(0, 0, 0, 0.34);
        height: 100%;
        position: absolute;
        width: 100%;
      }

      .quick-access {
        background: #0f0f0f;
        border-left: 1px solid #2a2a2a;
        box-shadow: -22px 0 56px rgba(0, 0, 0, 0.42);
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 18px 16px;
        position: absolute;
        right: 0;
        top: 0;
        width: 36%;
      }

      .header {
        align-items: center;
        display: flex;
        justify-content: space-between;
        padding-bottom: 13px;
      }

      .title {
        color: #f0f0f0;
        font-size: 15px;
        font-weight: 600;
      }

      .status {
        align-items: center;
        color: #8a8a8a;
        display: flex;
        font-size: 12px;
        gap: 7px;
      }

      .dot {
        background: #58a66c;
        border-radius: 999px;
        height: 7px;
        width: 7px;
      }

      .thread {
        align-items: center;
        border-bottom: 1px solid #242424;
        border-top: 1px solid #242424;
        color: #d8d8d8;
        display: flex;
        font-size: 13px;
        justify-content: space-between;
        min-height: 39px;
      }

      .thread span:last-child {
        color: #777;
      }

      .main {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
        padding: 15px 0;
      }

      .label {
        color: #888;
        font-size: 11px;
        margin-bottom: 4px;
      }

      .task {
        color: #e4e4e4;
        font-size: 14px;
        line-height: 1.35;
      }

      .log {
        display: flex;
        flex-direction: column;
        gap: 9px;
        overflow: auto;
        padding-right: 3px;
      }

      .msg {
        color: #d0d0d0;
        font-size: 12px;
        line-height: 1.35;
      }

      .approval {
        background: #171717;
        border: 1px solid #343434;
        border-radius: 7px;
        color: #e7e7e7;
        display: flex;
        flex-direction: column;
        font-size: 13px;
        gap: 9px;
        padding: 10px;
      }

      code {
        background: #0b0b0b;
        border: 1px solid #2a2a2a;
        border-radius: 5px;
        color: #d8d8d8;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 11px;
        padding: 8px;
      }

      .composer {
        border-top: 1px solid #242424;
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding-top: 13px;
      }

      input {
        background: #171717;
        border: 1px solid #343434;
        border-radius: 7px;
        color: #e6e6e6;
        outline: none;
        padding: 10px 11px;
        width: 100%;
      }

      input:focus,
      button:focus-visible {
        border-color: #6c6c6c;
        outline: 1px solid #6c6c6c;
      }

      .actions {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }

      button {
        align-items: center;
        background: #202020;
        border: 1px solid #343434;
        border-radius: 7px;
        color: #e6e6e6;
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        min-height: 39px;
        padding: 0 10px;
      }

      button:hover {
        background: #292929;
      }

      button:disabled {
        color: #666;
        cursor: default;
      }

      .primary {
        background: #d8d8d8;
        border-color: #d8d8d8;
        color: #111;
      }

      .primary:hover {
        background: #f0f0f0;
      }

      .tools {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
      }

      @media (max-width: 820px) {
        .quick-access {
          width: 44%;
        }
      }
    </style>
  </head>
  <body>
    <main class="deck">
      <section class="screen" aria-label="Steam Deck screen preview">
        <div class="game"></div>
        <div class="veil"></div>
        <aside class="quick-access" aria-label="Codex Remote panel">
          <header class="header">
            <div class="title">Codex</div>
            <div class="status"><span class="dot"></span><span id="status">working</span></div>
          </header>

          <div class="thread">
            <span id="thread">Decky remote</span>
            <span>›</span>
          </div>

          <section class="main">
            <div>
              <div class="label">Current</div>
              <div class="task" id="task">Create Decky plugin MVP</div>
            </div>

            <div class="log" id="log"></div>

            <div class="approval" id="approval">
              <div id="approvalText">Run build command?</div>
              <code id="command">pnpm run build</code>
            </div>
          </section>

          <footer class="composer">
            <input id="reply" placeholder="Message Codex" />
            <div class="actions">
              <button class="primary" id="approve">Approve</button>
              <button id="deny">Deny</button>
            </div>
            <div class="tools">
              <button id="pause">Pause</button>
              <button id="refresh">Refresh</button>
              <button id="reset">Reset</button>
            </div>
          </footer>
        </aside>
      </section>
    </main>

    <script>
      const initialState = {
        status: "working",
        thread: "Decky remote",
        task: "Create Decky plugin MVP",
        approvalText: "Run build command?",
        command: "pnpm run build",
        messages: [
          "Decky UI scaffold is built.",
          "Settings backend is ready.",
          "Approval needed: run pnpm build",
        ],
      };

      let state = structuredClone(initialState);

      const $ = (id) => document.getElementById(id);

      function push(message) {
        state.messages.push(message);
        state.messages = state.messages.slice(-5);
      }

      function render() {
        $("status").textContent = state.status;
        $("thread").textContent = state.thread;
        $("task").textContent = state.task;
        $("log").innerHTML = state.messages
          .map((message) => `<div class="msg">${message}</div>`)
          .join("");

        const needsApproval = Boolean(state.approvalText);
        $("approval").style.display = needsApproval ? "flex" : "none";
        $("approve").disabled = !needsApproval;
        $("deny").disabled = !needsApproval;

        if (needsApproval) {
          $("approvalText").textContent = state.approvalText;
          $("command").textContent = state.command || "";
        }
      }

      $("approve").addEventListener("click", () => {
        push("Approved from Steam Deck.");
        state.status = "working";
        state.task = "Running build command";
        delete state.approvalText;
        delete state.command;
        render();
      });

      $("deny").addEventListener("click", () => {
        push("Denied from Steam Deck.");
        state.status = "idle";
        state.task = "Waiting for next instruction";
        delete state.approvalText;
        delete state.command;
        render();
      });

      $("pause").addEventListener("click", () => {
        push("Paused from Steam Deck.");
        state.status = "idle";
        state.task = "Paused";
        render();
      });

      $("refresh").addEventListener("click", () => {
        push("State refreshed.");
        render();
      });

      $("reset").addEventListener("click", () => {
        state = structuredClone(initialState);
        $("reply").value = "";
        render();
      });

      $("reply").addEventListener("keydown", (event) => {
        if (event.key !== "Enter") {
          return;
        }

        const value = $("reply").value.trim();
        if (!value) {
          return;
        }

        push(`You: ${value}`);
        state.status = "working";
        state.task = "Processing reply";
        $("reply").value = "";
        render();
      });

      render();
    </script>
  </body>
</html>
